name: Update Blog Posts
  

on:
  push:
      branches:
        - main 
  workflow_dispatch:	
  schedule:
    - cron: '00 13 * * *' 

jobs:
  update_blog:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Set time zone
      run: |
        sudo ln -sf /usr/share/zoneinfo/Asia/Seoul /etc/localtime
        echo "Asia/Seoul" | sudo tee /etc/timezone
        date

    - name: Set Git User Info
      run: |
        git config --global user.name 'Leeeydia'
        git config --global user.email '172202826+Leeeydia@users.noreply.github.com'

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install feedparser gitpython

    - name: Run script
      run: python scripts/update_blog.py

    - name: Commit changes
      run: |
        git add .
        git commit -m "Auto update blog posts"

    - name: Push changes
      run: |
        git push https://${{ secrets.GH_PAT }}@github.com/Leeeydia/velog.git
